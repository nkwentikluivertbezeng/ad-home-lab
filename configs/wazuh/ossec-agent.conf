<!--
  Wazuh agent config (Windows) - only the parts I changed or care about.
  Full file on the agent: C:\Program Files (x86)\ossec-agent\ossec.conf
  TODO: replace with your real file (remove any key / password first).
-->
<ossec_config>

  <client>
    <server>
      <!-- Wazuh manager (Ubuntu VM on the internal network) -->
      <address>172.16.0.10</address>
      <port>1514</port>
      <protocol>tcp</protocol>
    </server>
    <enrollment>
      <enabled>yes</enabled>
      <!-- DC01 or CLIENT1 -->
      <agent_name>DC01</agent_name>
    </enrollment>
  </client>

  <!-- Windows event logs sent to Wazuh -->
  <localfile>
    <location>Security</location>
    <log_format>eventchannel</log_format>
  </localfile>

  <localfile>
    <location>System</location>
    <log_format>eventchannel</log_format>
  </localfile>

  <localfile>
    <location>Application</location>
    <log_format>eventchannel</log_format>
  </localfile>

  <!-- PowerShell activity (used for the "PowerShell execution" alerts) -->
  <localfile>
    <location>Microsoft-Windows-PowerShell/Operational</location>
    <log_format>eventchannel</log_format>
  </localfile>

  <!-- Sysmon: only if Sysmon is installed on the machine -->
  <localfile>
    <location>Microsoft-Windows-Sysmon/Operational</location>
    <log_format>eventchannel</log_format>
  </localfile>

</ossec_config>
